[project]
name = "tortoise-and-hare-paper-puppet"
version = "1.0.0"
description = "《龟兔赛跑》纸艺木偶动画：Pillow + NumPy 逐帧渲染，ffmpeg 编码"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
]

[project.optional-dependencies]
music = [
    "scipy>=1.13",
    "tinysoundfont>=0.3.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.uv]
package = false
